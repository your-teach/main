<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#28212b">
    <meta name="color-scheme" content="dark">
    <title>Подключение к занятию</title>

    <script>
        const CONFIG = {
            // lessonTitle: 'Занятие по программированию',
            // lessonTopic: 'none', // Например: 'Тема: Функции и алгоритмы' или 'none'

            // 1. Основная кнопка Zoom
            // zoomLink: 'https://zoom.us/',
            // zoomText: 'Подключиться к занятию через Zoom',
            // zoomPasscode: '123456',
            // telegramUsername: 'ergobound'

            // 2. Вторая кнопка (Шалфейный)
            materialsLink: 'none',
            materialsText: 'Материалы к уроку',

            // 3. Третья кнопка (Лавандовый)
            homeworkLink: 'none',
            homeworkText: 'Домашнее задание',

            // 4. Четвертая кнопка (Персиковый)
            recordingLink: 'none',
            recordingText: 'Запись прошлого урока',

            
        };
    </script>
    <!-- ================================================================= -->

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23b4cbe8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='23 7 16 12 23 17 23 7'/><rect x='1' y='5' width='15' height='14' rx='2' ry='2'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ---------- БАЗА ---------- */
        *,
        *::before,
        *::after { box-sizing: border-box; }

        * { margin: 0; padding: 0; }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;                 /* корректно на мобильных с адресной строкой */
            display: flex;
            flex-direction: column;
            background-color: #362d38;
            background-image: radial-gradient(circle at 50% 30%, #463948 0%, #28212b 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #e2dce4;

            /* отступы + учёт «челки» и скруглений экрана (safe-area) */
            --page-pad: clamp(12px, 3.5vw, 24px);
            padding-top: max(var(--page-pad), env(safe-area-inset-top));
            padding-right: max(var(--page-pad), env(safe-area-inset-right));
            padding-bottom: max(var(--page-pad), env(safe-area-inset-bottom));
            padding-left: max(var(--page-pad), env(safe-area-inset-left));

            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* ---------- ФОНОВОЕ СВЕЧЕНИЕ ---------- */
        .ambient {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
        }
        .glow-1 { width: 450px; height: 450px; background: #f4a2b8; top: -150px; left: 15%; }
        .glow-2 { width: 400px; height: 400px; background: #c58af9; bottom: -150px; right: 15%; }

        /* ---------- ОКНО IDE ---------- */
        .ide-window {
            position: relative;
            z-index: 1;
            margin: auto;                       /* вместо align-items: center — не обрезает контент */
            width: 100%;
            max-width: 760px;
            background: rgba(36, 40, 59, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(180, 195, 235, 0.16);
            border-radius: clamp(16px, 4vw, 20px);
            box-shadow: 0 25px 50px -12px rgba(15, 12, 22, 0.45);
            overflow: hidden;
        }

        /* ---------- ВЕРХНЯЯ ПАНЕЛЬ ---------- */
        .window-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 14px clamp(14px, 4vw, 20px);
            background: rgba(26, 29, 44, 0.6);
            border-bottom: 1px solid rgba(180, 195, 235, 0.08);
        }

        .window-dots {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .dot { width: 11px; height: 11px; border-radius: 50%; opacity: 0.8; }
        .dot-red { background: #eb9898; }
        .dot-yellow { background: #ebd298; }
        .dot-green { background: #a3d9b1; }

        .window-tab {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #8c98b8;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .window-spacer { width: 45px; flex-shrink: 0; }

        /* ---------- КОНТЕНТ ---------- */
        .window-body {
            padding: clamp(26px, 6vw, 44px) clamp(16px, 5vw, 40px);
            text-align: center;
            overflow-wrap: break-word;
        }

        .topic-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(11px, 3vw, 12px);
            color: #c5b4e3;
            background: rgba(197, 180, 227, 0.1);
            border: 1px solid rgba(197, 180, 227, 0.2);
            padding: 5px 12px;
            border-radius: 6px;
            display: inline-block;
            max-width: 100%;
            margin-bottom: 16px;
            overflow-wrap: anywhere;
        }

        h1 {
            color: #f5eff7;
            font-weight: 500;
            font-size: clamp(19px, 5vw, 25px);
            line-height: 1.3;
            margin-bottom: clamp(20px, 5vw, 32px);
            letter-spacing: -0.01em;
            overflow-wrap: break-word;
        }

        /* ---------- КНОПКИ ---------- */
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(10px, 2.5vw, 14px);
        }

        .empty-message {
            font-family: 'JetBrains Mono', monospace;
            color: #9aa7c7;
            font-size: clamp(12px, 3.4vw, 14px);
            padding: 18px 22px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(180, 195, 235, 0.25);
            border-radius: 12px;
            display: inline-block;
            max-width: 100%;
            overflow-wrap: anywhere;
        }

        .btn {
            /* гибкая ширина: 2 в ряд на планшете, 1 в ряд на телефоне */
            flex: 1 1 240px;
            max-width: 100%;
            min-width: 0;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            min-height: 48px;                   /* комфортная зона нажатия */
            padding: 14px 20px;
            font-family: inherit;
            font-size: clamp(13.5px, 3.6vw, 14px);
            font-weight: 500;
            line-height: 1.3;
            text-align: center;

            color: #1e293b;
            background-color: #b4cbe8;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            text-decoration: none;

            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .btn span { min-width: 0; overflow-wrap: break-word; }

        .btn svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.85; }

        /* Основная кнопка (Zoom) — по ширине содержимого, без растягивания */
        .btn.btn-primary {
            flex: 0 0 auto;
            width: auto;
            max-width: 100%;   /* страховка на очень узких экранах */
        }
        .btn-sage { background-color: #b8ccb9; color: #1a2e1f; }
        .btn-lavender { background-color: #cbbbe0; color: #231936; }
        .btn-peach { background-color: #dfc2b2; color: #331f13; }

        /* ---------- КОД ДОСТУПА ---------- */
        .passcode-wrapper { margin-top: clamp(18px, 4vw, 26px); }

        .passcode-box {
            display: inline-flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            max-width: 100%;
            padding: 9px 16px;
            background: rgba(20, 23, 36, 0.5);
            border: 1px solid rgba(180, 195, 235, 0.12);
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(11px, 3.2vw, 12px);
            color: #94a1c2;
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .passcode-value {
            color: #e2e8f5;
            font-weight: 500;
            overflow-wrap: anywhere;
        }
        .passcode-box svg { width: 14px; height: 14px; opacity: 0.7; flex-shrink: 0; }

        /* ---------- TELEGRAM ---------- */
        .telegram-wrapper {
            margin-top: clamp(18px, 4vw, 26px);
            font-size: clamp(12.5px, 3.4vw, 13.5px);
            line-height: 1.9;
            color: #94a1c2;
            overflow-wrap: anywhere;            
        }


        .tg-link {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(12px, 3.3vw, 13px);
            color: #b4cbe899;
            text-decoration: none;
            padding: 4px 10px;
            margin-left: 4px;
            border-radius: 6px;
            background: rgba(180, 203, 232, 0);
            /* border: 1px solid rgba(180, 203, 232, 0.22); */
            transition: color 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            display: inline-block;
            max-width: 100%;
            overflow-wrap: anywhere;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* ---------- HOVER ТОЛЬКО НА УСТРОЙСТВАХ С МЫШЬЮ ---------- */
        @media (hover: hover) and (pointer: fine) {
            .btn:hover {
                background-color: #bfd5f0;
                border-color: #ffffffc6;
                box-shadow: 0 0 0 3px rgba(0, 34, 75, 0.736);
            }
            .btn-sage:hover {
                background-color: #c3d6c4;
                border-color: #ffffff;
                box-shadow: 0 0 0 3px rgba(184, 204, 185, 0.4);
            }
            .btn-lavender:hover {
                background-color: #d5c6e8;
                border-color: #ffffff;
                box-shadow: 0 0 0 3px rgba(203, 187, 224, 0.4);
            }
            .btn-peach:hover {
                background-color: #e8ccbd;
                border-color: #ffffff;
                box-shadow: 0 0 0 3px rgba(223, 194, 178, 0.4);
            }
            .passcode-box:hover {
                border-color: rgba(255, 255, 255, 0.4);
                box-shadow: 0 0 0 2px rgba(180, 195, 235, 0.15);
                color: #d2dcf5;
            }
            .tg-link:hover {
                color: rgba(178, 212, 254, 0.889);
                background: rgba(180, 203, 232, 0.045);
                border-color: rgba(255, 255, 255, 0);
                /* box-shadow: 0 0 0 2px rgba(180, 203, 232, 0); */
            }
        }

        /* активное нажатие на тач-устройствах */
        .btn:active { transform: translateY(1px); }

        .btn:focus-visible,
        .tg-link:focus-visible {
            outline: 2px solid #b4cbe8;
            outline-offset: 3px;
        }

        /* ---------- МОБИЛЬНЫЕ ---------- */
        @media (max-width: 640px) {
            .window-body { padding: 30px 16px 32px; }
            h1 { margin-bottom: 22px; }

            .button-container { gap: 10px; }
            .btn { flex-basis: 100%; padding: 14px 16px; }  /* каждая кнопка на всю ширину */

            .empty-message { display: block; width: 100%; }

            .window-header { padding: 12px 14px; }

            /* облегчаем графику для слабых устройств */
            .ambient-glow { filter: blur(70px); }
            .ide-window {
                backdrop-filter: blur(14px);
                -webkit-backdrop-filter: blur(14px);
            }
        }

        @media (max-width: 380px) {
            .window-body { padding: 24px 12px 26px; }
            .btn { padding: 13px 14px; gap: 8px; }
            .btn svg { width: 16px; height: 16px; }
            .window-tab { font-size: 11px; }
            .window-spacer { width: 33px; }
            .passcode-box { width: 100%; }
        }

        /* альбомная ориентация на телефоне — компактнее по вертикали */
        @media (orientation: landscape) and (max-height: 500px) {
            .window-body { padding: 22px 20px; }
            h1 { margin-bottom: 16px; }
            .passcode-wrapper,
            .telegram-wrapper { margin-top: 14px; }
        }

        /* для тех, кто отключил анимации */
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body>

    <div class="ambient" aria-hidden="true">
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>
    </div>

    <div class="ide-window">
        <div class="window-header">
            <div class="window-dots">
                <span class="dot dot-red"></span>
                <span class="dot dot-yellow"></span>
                <span class="dot dot-green"></span>
            </div>
            <div class="window-tab">
                <!-- your-teach <span>&lt;/&gt;</span> -->
                 <!-- <span>&lt;/&gt;</span> -->
                  <span>Занятия по программированию</span> 
            </div>
            <div class="window-spacer"></div>
        </div>

        <div class="window-body">
            <div id="topicWrapper" style="display: none;"></div>
            <!-- <h1 id="mainTitle">Занятие по программированию</h1> -->

            <div class="button-container" id="buttonContainer"></div>
            <div class="passcode-wrapper" id="passcodeWrapper" style="display: none;"></div>
            <div class="telegram-wrapper" id="telegramWrapper" style="display: none;"></div>
        </div>
    </div>

    <script>
        function isActive(val) {
            if (!val) return false;
            const t = String(val).trim().toLowerCase();
            return t !== '' && t !== 'none' && t !== 'null' && t !== 'false';
        }

        if (isActive(CONFIG.lessonTitle)) {
            document.getElementById('mainTitle').textContent = CONFIG.lessonTitle;
        }

        if (isActive(CONFIG.lessonTopic)) {
            const tw = document.getElementById('topicWrapper');
            tw.style.display = 'block';
            tw.innerHTML = `<span class="topic-tag">// ${CONFIG.lessonTopic}</span>`;
        }

        const container = document.getElementById('buttonContainer');
        const buttonsList = [
            {
                link: CONFIG.zoomLink,
                text: CONFIG.zoomText || 'Подключиться к занятию через Zoom',
                className: 'btn btn-primary',   // ← было 'btn'
                icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>`
            },
            {
                link: CONFIG.materialsLink,
                text: CONFIG.materialsText || 'Материалы к уроку',
                className: 'btn btn-sage',
                icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>`
            },
            {
                link: CONFIG.homeworkLink,
                text: CONFIG.homeworkText || 'Домашнее задание',
                className: 'btn btn-lavender',
                icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>`
            },
            {
                link: CONFIG.recordingLink,
                text: CONFIG.recordingText || 'Запись прошлого урока',
                className: 'btn btn-peach',
                icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>`
            }
        ];

        let activeCount = 0;
        buttonsList.forEach(btn => {
            if (isActive(btn.link)) {
                const a = document.createElement('a');
                a.href = btn.link;
                a.className = btn.className;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.innerHTML = `${btn.icon}<span>${btn.text}</span>`;
                container.appendChild(a);
                activeCount++;
            }
        });

        if (activeCount === 0) {
            const emptyMsg = document.createElement('div');
            emptyMsg.className = 'empty-message';
            emptyMsg.textContent = 'Здесь будет ссылка для подключения к занятию';
            container.appendChild(emptyMsg);
        }

        // Быстрый переход по нажатию Enter для основной кнопки
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.repeat && isActive(CONFIG.zoomLink)) {
                window.open(CONFIG.zoomLink, '_blank', 'noopener,noreferrer');
            }
        });

        const passcodeWrapper = document.getElementById('passcodeWrapper');
        if (isActive(CONFIG.zoomPasscode)) {
            passcodeWrapper.style.display = 'block';
            passcodeWrapper.innerHTML = `
                <div class="passcode-box" id="passcodeBox" title="Нажмите, чтобы скопировать">
                    <span>код доступа zoom: <span class="passcode-value">${CONFIG.zoomPasscode}</span></span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </div>
            `;
            const box = document.getElementById('passcodeBox');
            const orig = box.innerHTML;
            box.addEventListener('click', () => {
                const done = () => {
                    box.innerHTML = '<span style="color: #b8ccb9;">✓ скопировано</span>';
                    setTimeout(() => box.innerHTML = orig, 2000);
                };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(CONFIG.zoomPasscode).then(done).catch(done);
                } else {
                    done();
                }
            });
        }

        // Блок со ссылкой на Telegram
        const telegramWrapper = document.getElementById('telegramWrapper');
        if (isActive(CONFIG.telegramUsername)) {
            const cleanUsername = String(CONFIG.telegramUsername).trim().replace(/^@/, '');
            telegramWrapper.style.display = 'block';
            telegramWrapper.innerHTML = `
                <span>Написать в телеграм: </span>
                <a href="https://t.me/${cleanUsername}" target="_blank" rel="noopener noreferrer" class="tg-link">@${cleanUsername}</a>
            `;
        }
    </script>
</body>
</html>
